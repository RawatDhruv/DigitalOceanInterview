spring:
  application:
    name: feature-management-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/feature_management}
    username: ${SPRING_DATASOURCE_USERNAME:fms}
    password: ${SPRING_DATASOURCE_PASSWORD:fms}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:2000}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:200ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:200ms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  cache:
    flag-ttl: ${APP_CACHE_FLAG_TTL:30s}
    override-ttl: ${APP_CACHE_OVERRIDE_TTL:30s}
    inherit-ttl: ${APP_CACHE_INHERIT_TTL:15s}
  resilience:
    db-fallback-max-concurrent: ${APP_RESILIENCE_DB_FALLBACK_MAX_CONCURRENT:32}
    db-fallback-failure-threshold: ${APP_RESILIENCE_DB_FALLBACK_FAILURE_THRESHOLD:5}
    db-fallback-open-duration: ${APP_RESILIENCE_DB_FALLBACK_OPEN_DURATION:10s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
