databaseChangeLog:
  - changeSet:
      id: 003-add-feature-flags-state-and-version
      author: feature-management-service
      changes:
        - addColumn:
            tableName: feature_flags
            columns:
              - column:
                  name: state
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
