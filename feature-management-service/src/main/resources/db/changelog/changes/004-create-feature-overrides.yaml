databaseChangeLog:
  - changeSet:
      id: 004-create-feature-overrides
      author: feature-management-service
      changes:
        - createTable:
            tableName: feature_overrides
            columns:
              - column:
                  name: flag_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: feature_overrides
            columnNames: flag_id, user_id
            constraintName: pk_feature_overrides
        - addForeignKeyConstraint:
            baseTableName: feature_overrides
            baseColumnNames: flag_id
            referencedTableName: feature_flags
            referencedColumnNames: id
            constraintName: fk_feature_overrides_flag
            onDelete: CASCADE
