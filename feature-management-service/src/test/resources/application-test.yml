spring:
  datasource:
    url: jdbc:h2:mem:feature_management;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms
      connect-timeout: 100ms
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  cache:
    flag-ttl: 30s
    override-ttl: 30s
    inherit-ttl: 15s
  resilience:
    db-fallback-max-concurrent: 32
    db-fallback-failure-threshold: 5
    db-fallback-open-duration: 2s

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
